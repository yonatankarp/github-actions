---
name: Dependabot auto-merge
on:
  workflow_call:
    secrets:
      GITHUB_PAT:
        description: "Token that can approve and merge pull requests."
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.workflow }}-${{ github.ref }}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approval for Dependabot PR
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge for Dependabot PRs
        id: auto-merge
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
        # GitHub can report a just-finished PR's status differently from what gh read, failing the first call; the retry re-reads it, then merges or arms.
        run: gh pr merge --auto --rebase "$PR_URL" || { sleep 10; gh pr merge --auto --rebase "$PR_URL"; }
